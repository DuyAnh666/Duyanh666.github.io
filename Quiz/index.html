<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Cổng Ôn tập HNUE</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --bg: #f8fafc;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100svh;
            padding: 24px 16px;
        }
        .login-card {
            background: white;
            padding: 38px 32px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: min(100%, 400px);
        }
        .login-brand {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin: 0 auto 12px;
            display: block;
        }
        .login-card h2 {
            margin: 0;
            color: var(--text-main);
            font-size: 1.4rem;
            font-weight: 600;
        }
        .login-subtitle {
            margin: 6px 0 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.92rem;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-hover);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            min-height: 42px;
            outline: none;
            transition: all 0.15s ease;
            background: #fff;
            color: var(--text-main);
        }
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .btn-login {
            width: 100%;
            padding: 11px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 4px;
        }
        .btn-login:hover { background: var(--primary-hover); }
        .error-msg {
            color: var(--danger);
            background: var(--danger-bg);
            border: 1px solid #fecaca;
            border-radius: 6px;
            padding: 8px 12px;
            text-align: center;
            margin-top: 16px;
            font-size: 0.88rem;
            font-weight: 500;
            display: none;
        }

        @media (max-width: 480px) {
            body { padding: 16px 12px; align-items: flex-start; }
            .login-card { padding: 28px 20px; }
            .login-card h2 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-brand">
            <img class="login-logo" src="Logo/logoHNUE.png" alt="Logo HNUE">
            <h2>Đăng nhập hệ thống</h2>
            <p class="login-subtitle">Cổng ôn tập trực tuyến HNUE</p>
        </div>
        <div class="form-group">
            <label>Tài khoản</label>
            <input type="text" id="username" placeholder="Nhập tài khoản...">
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu..." onkeypress="handleKeyPress(event)">
        </div>
        <button class="btn-login" onclick="handleLogin()">Vào học ngay</button>
        <div id="error-msg" class="error-msg">Tài khoản hoặc mật khẩu không chính xác!</div>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'home.html'; 
            }
        };

        function hashPassword(pass) {
            let sum = 0;
            for(let i = 0; i < pass.length; i++) {
                sum += pass.charCodeAt(i) * Math.pow(13, i);
            }
            return sum.toString(16) + "xZ";
        }

        const accounts = [
            { user: "admin", passHash: "14aeb4dxZ" },
            { user: "duyanh", passHash: "d9833136xZ" },
            { user: "nghung", passHash: "d9833136xZ" },
            { user: "nhuhoa", passHash: "d9833136xZ" },
            { user: "quynhhoa", passHash: "d9833136xZ" },
            { user: "ngochung", passHash: "d9833136xZ" },
            { user: "hnue1", passHash: "d9833136xZ" },
            { user: "hnue2", passHash: "d9833136xZ" },
            { user: "hnue3", passHash: "d9833136xZ" },
            { user: "hnue4", passHash: "d9833136xZ" }
        ];

        function handleKeyPress(e) {
            if (e.key === 'Enter') handleLogin();
        }

        function handleLogin() {
            const inputUser = document.getElementById('username').value.trim();
            const inputPass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const hashedInputPass = hashPassword(inputPass);

            const foundAccount = accounts.find(acc => acc.user === inputUser && acc.passHash === hashedInputPass);

            if (foundAccount) {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'home.html'; 
            } else {
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
