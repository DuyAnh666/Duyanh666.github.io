<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Trực tuyến</title>
    <style>
        :root {
            --primary: #4361ee;
            --border: #dee2e6;
            --bg-light: #f8f9fa;
            --success: #2a9d8f;
            --danger: #e63946;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #edf2f4;
            color: #333;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 1.25rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        /* Logo styling: sit next to title and stay close */
        .header-logo {
            height: 56px;
            width: auto;
            flex-shrink: 0;
        }

        .header-logo.left { margin-right: 8px; }
        .header-logo.right { margin-left: 8px; }

        header h1 { margin: 0; font-size: 1.6rem; text-align: center; }
        header p { margin: 6px 0 0 0; font-size: 0.95rem; opacity: 0.95; text-align: center; }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        .course-card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
            cursor: pointer;
            text-align: center;
            border-top: 8px solid var(--primary);
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .course-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.12);
        }

        .course-card h2 {
            color: var(--primary);
            margin-top: 0;
            font-size: 1.6rem;
            margin-bottom: 15px;
        }

        .course-card p {
            color: #666;
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-enter {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            transition: background 0.2s;
        }

        .course-card:hover .btn-enter {
            background: #324ed4;
        }
    </style>
</head>
<body>

    <header>
        <img src="Logo/logoHNUE.png" alt="HNUE" class="header-logo left">
        <div>
            <h1>Cổng Ôn tập Trực tuyến</h1>
            <p>Học tập - Ôn luyện - Kiểm tra</p>
        </div>
        <img src="Logo/logoFIT.png" alt="FIT" class="header-logo right">
    </header>

    <div class="container">
        <!-- Khóa học 1: Tư tưởng Hồ Chí Minh -->
        <a href="tthcm.html" class="course-card">
            <h2>📜 Tư tưởng Hồ Chí Minh</h2>
            <span class="btn-enter">Vào học phần →</span>
        </a>

        <!-- Khóa học 2: Kinh tế Chính trị Mác - Lênin -->
        <a href="ktct.html" class="course-card" style="border-top-color: var(--success);">
            <h2 style="color: var(--success);">📊 KTCT Mác - Lênin</h2>
            <span class="btn-enter" style="background: var(--success);">Vào học phần →</span>
        </a>
    </div>

</body>
</html>
