<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Ôn tập Trực tuyến - HNUE</title>
    <link rel="stylesheet" href="assets/quiz.css">
</head>
<body>

    <header>
        <div class="header-inner">
            <img class="brand-logo" src="Logo/logoHNUE.png" alt="Logo HNUE">
            <div class="header-copy">
                <h1>Cổng Ôn tập Trực tuyến</h1>
                <p>Đại học Sư phạm Hà Nội</p>
            </div>
            <img class="brand-logo" src="Logo/logoFIT.png" alt="Logo FIT">
        </div>
    </header>

    <div class="home-container" id="course-list"></div>

    <button class="btn-logout" onclick="handleLogout()">Đăng xuất tài khoản</button>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }

        const COURSES = [
            {
                href: 'tthcm.html',
                title: 'Tư tưởng Hồ Chí Minh',
                desc: 'Hệ thống câu hỏi trắc nghiệm ôn tập theo 6 chương và bộ đề thi thử tổng hợp kết thúc học phần.'
            },
            {
                href: 'ktct.html',
                title: 'Kinh tế chính trị Mác - Lênin',
                desc: 'Hệ thống câu hỏi ôn tập theo từng chương và đề thi thử mô phỏng 40 câu / 60 phút.'
            },
            {
                href: 'cnxhkh.html',
                title: 'Chủ nghĩa xã hội khoa học',
                desc: 'Hệ thống câu hỏi ôn tập theo 7 chương và đề thi thử mô phỏng 40 câu / 50 phút.'
            },
            {
                href: 'lsd.html',
                title: 'Lịch sử Đảng Cộng sản Việt Nam',
                desc: 'Hệ thống câu hỏi ôn tập theo từng chương và đề thi thử mô phỏng 40 câu / 50 phút.'
            },
            {
                href: 'hbhnue.html',
                title: 'Hiểu biết Sư phạm - HNUE',
                desc: 'Ngân hàng trắc nghiệm kiến thức giáo dục, nghề giáo, chính sách và văn hóa sư phạm. Đề thi chuẩn 20 câu / 10 phút.'
            },
            {
                href: 'xdkhdh.html',
                title: 'Xây dựng kế hoạch dạy học Tin học',
                desc: 'Hệ thống trắc nghiệm GDPT 2018 theo nhóm. Đề thi chuẩn 30 câu / 40 phút theo ma trận 3:4:3 (Nhận biết - Thông hiểu - Vận dụng).'
            }
        ];

        document.getElementById('course-list').innerHTML = COURSES.map(c => `
            <a href="${c.href}" class="course-card">
                <div class="card-body">
                    <h2>${c.title}</h2>
                    <p>${c.desc}</p>
                </div>
                <div class="card-footer">
                    <span class="btn-enter">Vào học phần</span>
                </div>
            </a>
        `).join('');

        function handleLogout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
