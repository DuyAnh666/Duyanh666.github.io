<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Ôn tập Trực tuyến - HNUE</title>
    <link rel="stylesheet" href="assets/quiz.css?v=5">
</head>
<body>

    <header>
        <div class="header-inner">
            <img class="brand-logo" src="Logo/logoHNUE.png" alt="Logo HNUE">
            <div class="header-copy">
                <div class="header-eyebrow">Hệ thống học tập trực tuyến</div>
                <h1>Cổng Ôn tập và Thi thử Trực tuyến</h1>
                <p>Trường Đại học Sư phạm Hà Nội</p>
            </div>
            <img class="brand-logo" src="Logo/logoFIT.png" alt="Logo FIT">
        </div>
    </header>

    <main class="home-wrapper">
        <div class="home-toolbar">
            <div class="home-toolbar-info">
                <h2>Danh mục học phần ôn tập</h2>
                <p>Lựa chọn học phần bên dưới để luyện tập theo từng chương hoặc làm bài thi thử tổng hợp</p>
            </div>
            <div class="home-toolbar-actions">
                <span class="home-count-badge" id="course-total-badge">6 học phần</span>
                <button class="btn-logout" onclick="handleLogout()">Đăng xuất</button>
            </div>
        </div>

        <div class="home-container" id="course-list"></div>
    </main>

    <footer class="site-footer">
        Hệ thống Ôn tập và Thi thử Trực tuyến — Trường Đại học Sư phạm Hà Nội
    </footer>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }

        const COURSES = [
            {
                href: 'tthcm.html',
                meta: '6 chương • Đề 40 câu',
                title: 'Tư tưởng Hồ Chí Minh',
                desc: 'Hệ thống câu hỏi trắc nghiệm ôn tập theo 6 chương và bộ đề thi thử tổng hợp kết thúc học phần.'
            },
            {
                href: 'ktct.html',
                meta: '6 chương • Đề 40 câu',
                title: 'Kinh tế chính trị Mác - Lênin',
                desc: 'Hệ thống câu hỏi ôn tập theo từng chương và đề thi thử mô phỏng 40 câu / 60 phút.'
            },
            {
                href: 'cnxhkh.html',
                meta: '7 chương • Đề 40 câu',
                title: 'Chủ nghĩa xã hội khoa học',
                desc: 'Hệ thống câu hỏi ôn tập theo 7 chương và đề thi thử mô phỏng 40 câu / 50 phút.'
            },
            {
                href: 'lsd.html',
                meta: '4 chương • Đề 40 câu',
                title: 'Lịch sử Đảng Cộng sản Việt Nam',
                desc: 'Hệ thống câu hỏi ôn tập theo từng chương và đề thi thử mô phỏng 40 câu / 50 phút.'
            },
            {
                href: 'hbhnue.html',
                meta: '5 chủ đề • Đề 20 câu',
                title: 'Hiểu biết Sư phạm - HNUE',
                desc: 'Ngân hàng trắc nghiệm kiến thức giáo dục, nghề giáo, chính sách pháp luật và văn hóa sư phạm.'
            },
            {
                href: 'xdkhdh.html',
                meta: '6 chủ đề • Đề 30 câu',
                title: 'Xây dựng kế hoạch dạy học Tin học',
                desc: 'Hệ thống trắc nghiệm GDPT 2018 theo nhóm học phần, đề thi chuẩn ma trận 3:4:3 (Nhận biết - Thông hiểu - Vận dụng).'
            }
        ];

        document.getElementById('course-total-badge').textContent = `${COURSES.length} học phần`;
        document.getElementById('course-list').innerHTML = COURSES.map(c => `
            <a href="${c.href}" class="course-card">
                <div class="card-body">
                    <h2>${c.title}</h2>
                    <p>${c.desc}</p>
                </div>
                <div class="card-footer">
                    <span class="card-unit-count">${c.meta}</span>
                    <span class="btn-enter">Vào học phần</span>
                </div>
            </a>
        `).join('');

        function handleLogout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
