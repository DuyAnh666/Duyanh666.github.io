<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Ôn tập &amp; Thi thử Trực tuyến - HNUE</title>
    <link rel="icon" type="image/png" href="Logo/favicon.png?v=29">
    <link rel="apple-touch-icon" href="Logo/favicon.png?v=29">
    <link rel="stylesheet" href="assets/quiz.css?v=29">
</head>
<body>

    <div id="navbar-root"></div>

    <main class="home-wrapper">
        <section class="home-hero-banner">
            <div class="home-hero-content">
                <span class="home-hero-badge">Trường Đại học Sư phạm Hà Nội</span>
                <h1>Xin chào, <span id="welcome-user-name">Học viên</span>!</h1>
            </div>

            <div class="home-hero-stats">
                <div class="hero-stat-box">
                    <span class="hero-stat-label">Bài đã làm</span>
                    <span class="hero-stat-value" id="hero-stat-count">0 bài</span>
                </div>
                <div class="hero-stat-box">
                    <span class="hero-stat-label">Điểm trung bình</span>
                    <span class="hero-stat-value" id="hero-stat-avg">0.00 / 10</span>
                </div>
                <div class="hero-stat-box">
                    <span class="hero-stat-label">Cao nhất</span>
                    <span class="hero-stat-value" id="hero-stat-best">0.00 / 10</span>
                </div>
            </div>
        </section>

        <div class="home-toolbar">
            <div class="home-category-tabs" id="home-category-tabs"></div>
            <div class="home-search-box">
                <input type="text" id="home-course-search" class="filter-search" placeholder="Tìm nhanh học phần..." oninput="renderCourseCatalog()">
            </div>
        </div>

        <div id="course-catalog-sections"></div>
    </main>

    <footer class="site-footer">
        <div>Hệ thống Ôn tập và Thi thử Trực tuyến — Trường Đại học Sư phạm Hà Nội</div>
        <div class="site-footer-sub">Monlabs - FIT - SMCS - HNUE</div>
    </footer>

    <script src="assets/cloud-config.js?v=29"></script>
    <script src="assets/auth.js?v=29"></script>
    <script>
        const currentUser = QuizAuth.requireAuth();
        const esc = QuizAuth.escHtml;
        let activeCategory = 'all';

        QuizAuth.mountNavbar('#navbar-root', { activePageId: 'home' });

        if (currentUser) {
            document.getElementById('welcome-user-name').textContent = currentUser.displayName;
        }

        function renderCategoryTabs() {
            const totalCourses = QuizAuth.getAllCourses().length;
            const tabs = [
                { id: 'all', label: `Tất cả học phần (${totalCourses})` },
                ...QuizAuth.COURSE_CATALOG.map(g => ({
                    id: g.categoryId,
                    label: `${g.categoryName} (${g.courses.length})`
                }))
            ];
            document.getElementById('home-category-tabs').innerHTML = tabs.map(t => `
                <button type="button" class="cat-tab${t.id === activeCategory ? ' active' : ''}" onclick="setCategoryFilter('${esc(t.id)}', this)">${esc(t.label)}</button>
            `).join('');
        }

        function setCategoryFilter(catId, btnEl) {
            activeCategory = catId;
            document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            renderCourseCatalog();
        }

        function renderCourseCatalog() {
            const query = (document.getElementById('home-course-search').value || '').trim().toLowerCase();
            const container = document.getElementById('course-catalog-sections');

            const sectionsHtml = QuizAuth.COURSE_CATALOG.map(group => {
                if (activeCategory !== 'all' && group.categoryId !== activeCategory) return '';

                const filteredCourses = group.courses.filter(c => {
                    if (!query) return true;
                    return c.title.toLowerCase().includes(query) || c.desc.toLowerCase().includes(query);
                });

                if (filteredCourses.length === 0) return '';

                const cardsHtml = filteredCourses.map(c => `
                    <a href="${c.href}" class="course-card">
                        <div class="card-body">
                            <h2>${esc(c.title)}</h2>
                            <p>${esc(c.desc)}</p>
                        </div>
                        <div class="card-footer">
                            <span class="card-unit-count">${esc(c.meta)}</span>
                            <span class="btn-enter">Vào học phần</span>
                        </div>
                    </a>
                `).join('');

                return `
                    <section class="catalog-section">
                        <div class="catalog-section-header">
                            <h2 class="catalog-section-title">${esc(group.categoryName)}</h2>
                            <span class="home-count-badge">${filteredCourses.length} học phần</span>
                        </div>
                        <div class="home-container">
                            ${cardsHtml}
                        </div>
                    </section>
                `;
            }).join('');

            container.innerHTML = sectionsHtml || '<div class="empty-state">Không tìm thấy học phần nào phù hợp với từ khóa tìm kiếm.</div>';
        }

        renderCategoryTabs();
        QuizAuth.refreshNavbarHistoryCount();
        renderCourseCatalog();
        QuizAuth.syncHistoryFromCloud();
    </script>
</body>
</html>
