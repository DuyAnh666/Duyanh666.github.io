<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Ôn tập Trực tuyến</title>
    <style>
        :root {
            --primary: #4361ee;
            --success: #2a9d8f;
            --danger: #e63946;
            --bg: #edf2f4;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #5b6472;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: 
                radial-gradient(circle at top left, rgba(67, 97, 238, 0.14), transparent 34%),
                radial-gradient(circle at top right, rgba(42, 157, 143, 0.12), transparent 28%),
                var(--bg);
            margin: 0;
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            color: white;
            padding: 1.25rem 1rem 1.75rem;
            margin-bottom: 0; /* Đã bỏ margin-bottom để tự căn chỉnh ở phần container */
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
        }

        header::after {
            content: "";
            position: absolute;
            inset: auto -10% -55% auto;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 1rem;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .brand-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            padding: 8px;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.16);
        }

        .header-copy {
            text-align: center;
            padding: 0.5rem 0;
        }

        header h1 {
            margin: 0;
            font-size: clamp(1.7rem, 3vw, 2.5rem);
            letter-spacing: 0.2px;
        }

        header p {
            margin: 10px 0 0;
            font-size: 1.05rem;
            opacity: 0.92;
        }

        .container {
            max-width: 800px; /* Thu hẹp chiều ngang tối đa để 2 thẻ gần nhau hơn */
            margin: 60px auto auto auto; /* Cách header 60px */
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* Thu nhỏ kích thước tối thiểu của thẻ */
            gap: 30px;
            flex: 1;
            align-content: start; /* QUAN TRỌNG: Ngăn chặn các thẻ bị giãn dài xuống dưới */
        }

        .course-card {
            background: var(--card);
            padding: 35px 20px; /* Giảm padding trên dưới để thẻ lùn lại */
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
            cursor: pointer;
            text-align: center;
            border-top: 8px solid var(--primary);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .course-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.12);
        }

        .course-card h2 {
            color: var(--primary);
            margin-top: 0;
            font-size: 1.4rem; /* Chữ nhỏ lại một chút */
            margin-bottom: 20px; /* Khoảng cách giữa chữ và nút nhỏ lại */
        }

        .btn-enter {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 10px 22px; /* Nút bấm gọn gàng hơn */
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
        }

        /* Nút Đăng xuất nhỏ gọn ở góc dưới cùng bên trái */
        .btn-logout { 
            position: fixed; 
            bottom: 20px; 
            left: 20px; 
            background: white; 
            color: var(--danger); 
            border: 1px solid var(--danger); 
            padding: 6px 14px; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 0.85rem;
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 2px 5px rgba(230, 57, 70, 0.1);
            z-index: 100; 
            opacity: 0.8; 
        }

        .btn-logout:hover { 
            background: var(--danger); 
            color: white;
            opacity: 1; 
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(230, 57, 70, 0.2);
        }

        @media (max-width: 720px) {
            header { padding-bottom: 1.4rem; }

            .header-inner {
                grid-template-columns: 1fr;
                justify-items: center;
            }

            .header-copy { order: 2; }

            .brand-logo { width: 64px; height: 64px; }

            .container { grid-template-columns: 1fr; margin-top: 40px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <img class="brand-logo" src="Logo/logoHNUE.png" alt="Logo HNUE">
            <div class="header-copy">
                <h1>Cổng Ôn tập Trực tuyến</h1>
                <p>Lựa chọn học phần bạn muốn ôn luyện và thi thử</p>
            </div>
            <img class="brand-logo" src="Logo/logoFIT.png" alt="Logo FIT">
        </div>
    </header>

    <div class="container">
        <a href="tthcm.html" class="course-card">
            <h2>📜 Tư tưởng Hồ Chí Minh</h2>
            <span class="btn-enter">Vào học phần →</span>
        </a>

        <a href="ktct.html" class="course-card" style="border-top-color: var(--success);">
            <h2 style="color: var(--success);">📊 KTCT Mác - Lênin</h2>
            <span class="btn-enter" style="background: var(--success);">Vào học phần →</span>
        </a>
    </div>

    <!-- Nút đăng xuất -->
    <button class="btn-logout" onclick="handleLogout()">Đăng xuất</button>

    <script>
        // BẢO MẬT: Kiểm tra xem đã đăng nhập chưa. Nếu chưa, đuổi về index.html
        window.onload = function() {
            if (localStorage.getItem('isLoggedIn') !== 'true') {
                window.location.href = 'index.html';
            }
        };

        // Xóa phiên và quay về đăng nhập
        function handleLogout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
