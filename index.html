<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập &amp; Đăng ký - Cổng Ôn tập HNUE</title>
    <link rel="stylesheet" href="assets/quiz.css?v=9">
</head>
<body class="login-page">

    <div class="login-shell">
        <div class="login-showcase">
            <div class="showcase-header">
                <div class="showcase-logos">
                    <img class="showcase-logo" src="Logo/logoHNUE.png" alt="Logo HNUE">
                    <img class="showcase-logo" src="Logo/logoFIT.png" alt="Logo FIT">
                </div>
                <span class="showcase-badge">Trường Đại học Sư phạm Hà Nội</span>
            </div>

            <div class="showcase-footer">
                <h1>Cổng Ôn tập &amp; Thi thử Trực tuyến</h1>
                <p class="showcase-motto">Chuẩn mực • Sáng tạo • Tiên phong</p>
            </div>
        </div>

        <div class="login-card">
            <div class="login-brand">
                <h2 id="auth-heading">Đăng nhập hệ thống</h2>
            </div>

            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tab-login" onclick="switchTab('login')">Đăng nhập</button>
                <button type="button" class="auth-tab" id="tab-register" onclick="switchTab('register')">Tạo tài khoản</button>
            </div>

            <div id="form-login">
                <div class="form-group">
                    <label for="username">Tên tài khoản</label>
                    <input type="text" id="username" placeholder="Nhập tên tài khoản..." onkeypress="handleLoginKey(event)">
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu..." onkeypress="handleLoginKey(event)">
                </div>
                <button type="button" class="btn-login" id="btn-login-submit" onclick="handleLogin()">Đăng nhập</button>
            </div>

            <div id="form-register" style="display: none;">
                <div class="form-group">
                    <label for="reg-fullname">Họ và tên hiển thị</label>
                    <input type="text" id="reg-fullname" placeholder="Ví dụ: Nguyễn Duy Anh" onkeypress="handleRegisterKey(event)">
                </div>
                <div class="form-group">
                    <label for="reg-username">Tên tài khoản</label>
                    <input type="text" id="reg-username" placeholder="3-24 ký tự chữ thường hoặc số..." onkeypress="handleRegisterKey(event)">
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label for="reg-password">Mật khẩu</label>
                        <input type="password" id="reg-password" placeholder="Ít nhất 4 ký tự..." onkeypress="handleRegisterKey(event)">
                    </div>
                    <div class="form-group">
                        <label for="reg-confirm">Xác nhận mật khẩu</label>
                        <input type="password" id="reg-confirm" placeholder="Nhập lại mật khẩu..." onkeypress="handleRegisterKey(event)">
                    </div>
                </div>
                <button type="button" class="btn-login" id="btn-register-submit" onclick="handleRegister()">Tạo tài khoản</button>
            </div>

            <div id="error-msg" class="error-msg"></div>
            <div id="success-msg" class="success-msg"></div>
        </div>
    </div>

    <script src="assets/cloud-config.js?v=9"></script>
    <script src="assets/auth.js?v=9"></script>
    <script>
        window.onload = function() {
            if (window.QuizAuth && QuizAuth.getCurrentUser()) {
                window.location.href = 'home.html';
            }
        };

        function clearMessages() {
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('success-msg').style.display = 'none';
        }

        function showError(msg) {
            clearMessages();
            const err = document.getElementById('error-msg');
            err.textContent = msg;
            err.style.display = 'block';
        }

        function switchTab(mode) {
            clearMessages();
            const isLogin = mode === 'login';
            document.getElementById('tab-login').classList.toggle('active', isLogin);
            document.getElementById('tab-register').classList.toggle('active', !isLogin);
            document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
            document.getElementById('form-register').style.display = isLogin ? 'none' : 'block';
            document.getElementById('auth-heading').textContent = isLogin
                ? 'Đăng nhập hệ thống'
                : 'Tạo tài khoản cá nhân';
        }

        function handleLoginKey(e) {
            if (e.key === 'Enter') handleLogin();
        }

        function handleRegisterKey(e) {
            if (e.key === 'Enter') handleRegister();
        }

        async function handleLogin() {
            clearMessages();
            const btn = document.getElementById('btn-login-submit');
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'Đang kiểm tra...';
            const res = await QuizAuth.login(user, pass);
            btn.disabled = false;
            btn.textContent = 'Đăng nhập';

            if (res.ok) {
                window.location.href = 'home.html';
            } else {
                showError(res.message);
            }
        }

        async function handleRegister() {
            clearMessages();
            const btn = document.getElementById('btn-register-submit');
            const fullName = document.getElementById('reg-fullname').value;
            const user = document.getElementById('reg-username').value;
            const pass = document.getElementById('reg-password').value;
            const confirmPass = document.getElementById('reg-confirm').value;

            btn.disabled = true;
            btn.textContent = 'Đang khởi tạo...';
            const res = await QuizAuth.register(fullName, user, pass, confirmPass);
            btn.disabled = false;
            btn.textContent = 'Tạo tài khoản';

            if (res.ok) {
                window.location.href = 'home.html';
            } else {
                showError(res.message);
            }
        }
    </script>
</body>
</html>
