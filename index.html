<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Cổng Ôn tập</title>
    <style>
        :root { --primary: #4361ee; --border: #dee2e6; --danger: #e63946; }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #edf2f4;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100svh;
            padding: 24px 16px;
        }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: min(100%, 400px); border-top: 5px solid var(--primary); }
        .login-card h2 { margin-top: 0; color: var(--primary); text-align: center; margin-bottom: 25px; font-size: 1.8rem;}
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 1rem; min-height: 44px; }
        .btn-login { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .btn-login:hover { background: #324ed4; }
        .error-msg { color: var(--danger); text-align: center; margin-top: 15px; font-size: 0.95rem; font-weight: bold; display: none; }

        @media (max-width: 480px) {
            body { padding: 16px 12px; align-items: flex-start; }
            .login-card { padding: 28px 18px; }
            .login-card h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Đăng nhập hệ thống</h2>
        <div class="form-group">
            <label>Tài khoản</label>
            <input type="text" id="username" placeholder="Nhập tài khoản...">
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu..." onkeypress="handleKeyPress(event)">
        </div>
        <button class="btn-login" onclick="handleLogin()">Vào học ngay</button>
        <div id="error-msg" class="error-msg">Tài khoản hoặc mật khẩu không chính xác!</div>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'home.html'; 
            }
        };

        function hashPassword(pass) {
            let sum = 0;
            for(let i = 0; i < pass.length; i++) {
                sum += pass.charCodeAt(i) * Math.pow(13, i);
            }
            return sum.toString(16) + "xZ";
        }

        const accounts = [
            { user: "admin", passHash: "14aeb4dxZ" },
            
        ];

        function handleKeyPress(e) {
            if (e.key === 'Enter') handleLogin();
        }

        function handleLogin() {
            const inputUser = document.getElementById('username').value.trim();
            const inputPass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const hashedInputPass = hashPassword(inputPass);

            const foundAccount = accounts.find(acc => acc.user === inputUser && acc.passHash === hashedInputPass);

            if (foundAccount) {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'home.html'; 
            } else {
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
