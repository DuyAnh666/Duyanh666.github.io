<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Cổng Ôn tập HNUE</title>
    <link rel="stylesheet" href="assets/quiz.css?v=2">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-brand">
            <img class="login-logo" src="Logo/logoHNUE.png" alt="Logo HNUE">
            <h2>Đăng nhập hệ thống</h2>
            <p class="login-subtitle">Cổng ôn tập trực tuyến HNUE</p>
        </div>
        <div class="form-group">
            <label for="username">Tài khoản</label>
            <input type="text" id="username" placeholder="Nhập tên tài khoản..." onkeypress="handleKeyPress(event)">
        </div>
        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu..." onkeypress="handleKeyPress(event)">
        </div>
        <button class="btn-login" onclick="handleLogin()">Vào học ngay</button>
        <div id="error-msg" class="error-msg">Tài khoản hoặc mật khẩu không chính xác!</div>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'home.html';
            }
        };

        function hashPassword(pass) {
            let sum = 0;
            for (let i = 0; i < pass.length; i++) {
                sum += pass.charCodeAt(i) * Math.pow(13, i);
            }
            return sum.toString(16) + 'xZ';
        }

        const accounts = [
            { user: 'admin', passHash: '14aeb4dxZ' },
            { user: 'duyanh', passHash: 'd9833136xZ' },
            { user: 'nghung', passHash: 'd9833136xZ' },
            { user: 'nhuhoa', passHash: 'd9833136xZ' },
            { user: 'quynhhoa', passHash: 'd9833136xZ' },
            { user: 'ngochung', passHash: 'd9833136xZ' },
            { user: 'hnue1', passHash: 'd9833136xZ' },
            { user: 'hnue2', passHash: 'd9833136xZ' },
            { user: 'hnue3', passHash: 'd9833136xZ' },
            { user: 'hnue4', passHash: 'd9833136xZ' }
        ];

        function handleKeyPress(e) {
            if (e.key === 'Enter') handleLogin();
        }

        function handleLogin() {
            const inputUser = document.getElementById('username').value.trim();
            const inputPass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const hashedInputPass = hashPassword(inputPass);

            const foundAccount = accounts.find(acc => acc.user === inputUser && acc.passHash === hashedInputPass);

            if (foundAccount) {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'home.html';
            } else {
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
